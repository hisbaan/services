# Example deployment. Copy api/.env.example to .env and fill it in.
services:
  loupe:
    image: ghcr.io/hisbaan/loupe:canary
    container_name: loupe
    restart: unless-stopped
    env_file: .env
    user: "1000:100"
    ports:
      - 3000:3000
    volumes:
      - /mnt/nas/docker/loupe/data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    networks:
      - labnet
networks:
  labnet:
    external: true
